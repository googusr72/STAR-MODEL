name: Build STAR APK

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack the project
        run: |
          set -euo pipefail
          ZIP="$(ls -1 ./*.zip 2>/dev/null | head -n 1 || true)"
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found. Upload STAR-android-project.zip to the main page of this repository."
            exit 1
          fi
          mkdir -p project
          unzip -q -o "$ZIP" -d project
          GRADLEW="$(find project -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found inside the zip."
            exit 1
          fi
          echo "ROOT=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease \
            -PstarVersionName="0.0.${{ github.run_number }}" \
            -PstarVersionCode="${{ github.run_number }}"

      - name: Collect the APK
        run: |
          set -euo pipefail
          APK="$(find "$ROO